<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>更新任務</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding-bottom:32px}
.header{background:linear-gradient(135deg,#722F37,#4a1a20);padding:16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0006}
.header h1{font-size:16px;font-weight:700;color:#fff}
.header .subtitle{font-size:12px;color:#ffcccc;margin-top:2px}
.card{background:#16213e;border-radius:12px;margin:16px;padding:16px;box-shadow:0 2px 8px #0004}
.section-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #ffffff0f}
.info-row:last-child{border-bottom:none}
.info-label{font-size:12px;color:#888}
.info-value{font-size:13px;font-weight:600;color:#e0e0e0;text-align:right;max-width:60%}
.field{margin-bottom:14px}
label{display:block;font-size:12px;color:#aaa;margin-bottom:5px;font-weight:600}
select,input[type=date]{width:100%;background:#0f3460;border:1px solid #ffffff1a;border-radius:8px;color:#e0e0e0;padding:10px 12px;font-size:14px;appearance:none;-webkit-appearance:none}
select:focus,input[type=date]:focus{outline:none;border-color:#722F37}
.notes-existing{background:#0a0a1a;border-radius:8px;padding:10px;font-size:11px;color:#888;max-height:160px;overflow-y:auto;margin-bottom:8px;line-height:1.5}
.notes-existing.empty{color:#444;font-style:italic}
.note-entry{padding:6px 0;border-bottom:1px solid #ffffff08}
.note-entry:last-child{border-bottom:none}
.note-time{font-size:10px;color:#555;margin-bottom:2px}
.note-author{color:#818cf8;font-weight:600}
.note-text{color:#aaa;word-break:break-word}
textarea{width:100%;background:#0f3460;border:1px solid #ffffff1a;border-radius:8px;color:#e0e0e0;padding:10px 12px;font-size:14px;resize:none;height:90px;font-family:inherit}
textarea:focus{outline:none;border-color:#722F37}
textarea::placeholder{color:#555}
.btn-save{display:block;width:calc(100% - 32px);margin:16px;padding:15px;background:linear-gradient(135deg,#722F37,#9b3a45);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px #722F3766}
.btn-save:active{opacity:.85;transform:scale(.98)}
.btn-save:disabled{background:#333;color:#666;box-shadow:none;cursor:not-allowed}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#27AE60;color:#fff;padding:12px 24px;border-radius:100px;font-size:14px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.error{background:#E74C3C}
.toast.show{opacity:1}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px;color:#666}
.spinner{width:36px;height:36px;border:3px solid #ffffff1a;border-top-color:#722F37;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:700}
.error-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px;padding:24px;text-align:center}
.error-screen .icon{font-size:44px}
.error-screen .msg{color:#f87171;font-size:14px;font-weight:600}
.error-screen .detail{color:#666;font-size:12px;max-width:260px}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div>驗證身份中…</div>
</div>

<div id="error-screen" class="error-screen" style="display:none">
  <div class="icon">🔒</div>
  <div class="msg" id="errorMsg">無法存取</div>
  <div class="detail" id="errorDetail">請確認您的 LINE 帳號已綁定員工資料。</div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <h1 id="taskTitle">—</h1>
    <div class="subtitle" id="workflowName">—</div>
  </div>

  <div class="card">
    <div class="section-title">任務資訊</div>
    <div class="info-row">
      <span class="info-label">負責人</span>
      <span class="info-value" id="assigneeName">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">建立時間</span>
      <span class="info-value" id="createdAt">—</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title">編輯任務</div>
    <div class="field">
      <label>狀態</label>
      <select id="status">
        <option value="pending">待處理</option>
        <option value="in_progress">進行中</option>
        <option value="completed">已完成</option>
        <option value="blocked">封鎖中</option>
        <option value="cancelled">已取消</option>
      </select>
    </div>
    <div class="field">
      <label>優先級</label>
      <select id="priority">
        <option value="low">🟢 低</option>
        <option value="medium">🟡 中</option>
        <option value="high">🔴 高</option>
        <option value="urgent">🚨 緊急</option>
      </select>
    </div>
    <div class="field">
      <label>截止日期</label>
      <input type="date" id="dueDate"/>
    </div>
  </div>

  <div class="card">
    <div class="section-title">備註記錄</div>
    <div id="existingNotes" class="notes-existing empty">（尚無備註）</div>
    <label style="margin-top:4px">新增備註</label>
    <textarea id="newNote" placeholder="輸入備註內容…"></textarea>
  </div>

  <button class="btn-save" id="saveBtn" onclick="saveTask()">💾 儲存更新</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://kzawtuvmchhtdsokrjys.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_j4d5NBq-JxIBz-F8GpOLog_u8bEkynM';
const LIFF_ID = '2009567492-Hpa3NSAi';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let taskId = null;
let taskData = null;
let currentUserId = null;
let currentUserName = '';
let currentOrgId = null;

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '') + ' show';
  setTimeout(() => { t.className = 'toast'; }, 2800);
}

function showError(msg, detail) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('errorMsg').textContent = msg;
  if (detail) document.getElementById('errorDetail').textContent = detail;
  document.getElementById('error-screen').style.display = 'flex';
}

function fmt(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr).toLocaleDateString('zh-TW');
}

function renderNotes(notesData) {
  const el = document.getElementById('existingNotes');
  let entries = [];
  if (Array.isArray(notesData)) {
    entries = notesData;
  } else if (typeof notesData === 'string' && notesData.trim()) {
    el.textContent = notesData;
    el.className = 'notes-existing';
    return;
  }

  if (entries.length === 0) {
    el.innerHTML = '';
    el.textContent = '（尚無備註）';
    el.className = 'notes-existing empty';
    return;
  }

  el.className = 'notes-existing';
  el.innerHTML = entries.map(function(e) {
    var time = e.time ? new Date(e.time).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false }) : '';
    var author = e.author || '';
    var text = (e.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return '<div class="note-entry">'
      + (time ? '<div class="note-time">' + time + (author ? ' — <span class="note-author">' + author + '</span>' : '') + '</div>' : '')
      + '<div class="note-text">' + text + '</div>'
      + '</div>';
  }).join('');
}

async function loadTask() {
  var params = new URLSearchParams(window.location.search);
  taskId = params.get('task_id');
  if (!taskId) { showError('缺少任務 ID', '此連結無效，請從 LINE 訊息中重新開啟。'); return; }

  var { data, error } = await sb
    .from('tasks')
    .select('id, title, status, priority, due_date, notes, metadata, created_at, organization_id, assigned_to, workflow_instance_id, assignee:users!tasks_assigned_to_fkey(name), workflow_instance:workflow_instances(name)')
    .eq('id', taskId)
    .maybeSingle();

  if (error || !data) { showError('載入失敗', error?.message ?? '找不到此任務'); return; }

  if (currentOrgId && data.organization_id && data.organization_id !== currentOrgId) {
    showError('無權存取', '此任務不屬於您的組織。');
    return;
  }

  taskData = data;

  document.getElementById('taskTitle').textContent = data.title;
  document.getElementById('workflowName').textContent = data.workflow_instance?.name ?? '—';
  document.getElementById('assigneeName').textContent = data.assignee?.name ?? '—';
  document.getElementById('createdAt').textContent = fmt(data.created_at);
  document.getElementById('status').value = data.status ?? 'pending';
  document.getElementById('priority').value = data.priority ?? 'medium';
  document.getElementById('dueDate').value = data.due_date ? data.due_date.slice(0, 10) : '';

  var noteEntries = data.metadata?.note_entries;
  if (noteEntries && Array.isArray(noteEntries) && noteEntries.length > 0) {
    renderNotes(noteEntries);
  } else {
    renderNotes(data.notes);
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

async function saveTask() {
  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '儲存中…';

  var status = document.getElementById('status').value;
  var priority = document.getElementById('priority').value;
  var dueDate = document.getElementById('dueDate').value || null;
  var newNote = document.getElementById('newNote').value.trim();

  var updates = {
    status: status,
    priority: priority,
    due_date: dueDate,
    updated_at: new Date().toISOString(),
  };

  if (status === 'completed' && taskData.status !== 'completed') {
    updates.completed_at = new Date().toISOString();
  } else if (status !== 'completed') {
    updates.completed_at = null;
  }

  if (newNote) {
    var existingMeta = taskData.metadata || {};
    var existingEntries = Array.isArray(existingMeta.note_entries) ? existingMeta.note_entries : [];

    if (existingEntries.length === 0 && taskData.notes && taskData.notes.trim()) {
      existingEntries.push({
        time: taskData.created_at,
        author: '(舊備註)',
        text: taskData.notes,
      });
    }

    existingEntries.push({
      time: new Date().toISOString(),
      author: currentUserName || '(LINE 使用者)',
      text: newNote,
    });

    updates.metadata = Object.assign({}, existingMeta, { note_entries: existingEntries });

    var ts = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
    var existing = taskData.notes ? taskData.notes + '\n' : '';
    updates.notes = existing + '[' + ts + ' ' + (currentUserName || '') + '] ' + newNote;
  }

  var { error } = await sb.from('tasks').update(updates).eq('id', taskId);

  btn.disabled = false;
  btn.textContent = '💾 儲存更新';

  if (error) {
    showToast('儲存失敗：' + error.message, true);
  } else {
    showToast('✅ 已儲存！');
    document.getElementById('newNote').value = '';
    taskData = Object.assign({}, taskData, updates);
    var entries = updates.metadata?.note_entries || taskData.metadata?.note_entries;
    if (entries) renderNotes(entries);
    setTimeout(function() {
      try { liff.closeWindow(); } catch(e) { window.close(); }
    }, 1500);
  }
}

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    var profile = await liff.getProfile();
    currentUserName = profile.displayName || '';

    var { data: lu } = await sb
      .from('line_users')
      .select('user_id')
      .eq('line_user_id', profile.userId)
      .maybeSingle();

    if (!lu?.user_id) {
      showError('帳號未綁定', '您的 LINE 帳號尚未綁定員工資料，請先使用 /註冊 指令進行綁定。');
      return;
    }

    currentUserId = lu.user_id;

    var { data: user } = await sb
      .from('users')
      .select('organization_id, name')
      .eq('id', currentUserId)
      .maybeSingle();

    if (user) {
      currentOrgId = user.organization_id;
      if (user.name) currentUserName = user.name;
    }
  } catch (e) {
    console.warn('LIFF init:', e);
  }
  await loadTask();
}

init();
</script>
</body>
</html>
